name: Release

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64, ppc64]
        include:
          - goarch: amd64
            arch_suffix: amd64
          - goarch: arm64
            arch_suffix: arm64
          - goarch: ppc64
            arch_suffix: ppc64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -o "oci-chroot-linux-${{ matrix.arch_suffix }}" .

      - uses: actions/upload-artifact@v4
        with:
          name: oci-chroot-linux-${{ matrix.arch_suffix }}
          path: oci-chroot-linux-${{ matrix.arch_suffix }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: Build ${{ github.run_number }}
          body: |
            Auto-built from commit ${{ github.sha }}

            - x86_64 (linux-amd64)
            - aarch64 (linux-arm64)
            - powerpc64 (linux-ppc64)
          files: artifacts/**/*
          fail_on_unmatched_files: true
          draft: true
